# Build the Astro site and publish it to GitHub Pages.
# The site lives in website/; this builds it and deploys on pushes to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy-website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: website
          node-version: 24
        env:
          # https://<owner>.github.io/<repo>/
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
