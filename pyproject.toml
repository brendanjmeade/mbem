# Packaging for the mollified boundary element method.
#
# WHY THE FLAT ORACLES ARE TOP-LEVEL MODULES, not a subpackage: the frozen
# meshing oracles do `from mollified_bem import TriMesh`, and ~30 files do
# `import mollified_bem as mb`. Keeping the flat names means NO frozen file
# needed editing. A subpackage would have required it, which the
# oracles-are-frozen rule forbids.
#
# WHY THERE ARE TWO KERNEL PACKAGES, `mollified_kernel` and `moss_kernel`:
# they are different files (the first's analytical_kernels.py is 49,069 B, the
# second's is 51,562 B and holds analytical_eigenstress_kernel /
# eigenstress_batch, which the first lacks) and the difference IS the point --
# the gates compare them entrywise, so neither may be "fixed" to agree with
# the other. Two distinct package names let one interpreter hold both, which a
# single name never could.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbem"
version = "0.1.0"
description = "Mollified boundary element method for 3-D linear elasticity"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brendan Meade", email = "brendanjmeade@gmail.com" }]
keywords = [
    "boundary element method", "elasticity", "regularized stokeslets",
    "dislocation", "hierarchical matrices", "fast multipole method",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# threadpoolctl is NOT optional: la/hop.py imports it at module scope to pin
# BLAS to one thread inside the block thread pool. It was missing here while
# the development environment happened to provide it, so a fresh install broke
# on the first compressed-backend solve and nowhere earlier.
dependencies = [
    "numpy", "scipy", "matplotlib", "numba", "triangle", "threadpoolctl",
]

[project.urls]
Homepage = "https://github.com/brendanjmeade/mbem"
Repository = "https://github.com/brendanjmeade/mbem"

[project.optional-dependencies]
# cutde anchors the classical-TDE gates (verify_solved_bvp, verify_evaluate_stress)
# and two demos. Those gates FAIL rather than skip without it, so it is a test
# requirement, not a convenience.
tde = ["cutde"]
# vtk anchors verify_volume's independent-reader clause: the hand-rolled .vti
# writer is otherwise validated only by its own reader, which cannot see a
# wrong byte layout because the error would be symmetric. Like cutde, the gate
# FAILS rather than skips without it. (A trame viewer will extend this extra.)
viz = ["vtk"]
# sympy/mpmath are clq's verification-only dependencies, and three of moss's
# oracle gates need sympy.
test = ["pytest", "sympy", "mpmath"]

[tool.setuptools]
# One source root now that the tree is packaged. Phase 1 pointed these at the
# old locations so the install was a no-op for imports; the directories have
# since moved, and nothing computes a path to find them any more.
package-dir = { "" = "src" }
# Listed explicitly rather than found, so `verify/` and `examples/` are never
# packaged by accident -- they are scripts, run by path, not importable units.
packages = [
    "mbem",
    "mbem.backends",
    "mbem.cases",
    "mbem.kernels",
    "mbem.la",
    "mbem.model",
    "mollified_kernel",
    "clq",
    "moss_kernel",
]
py-modules = [
    "mollified_bem",
    "anelastic",
    "local_box_mesh",
    "local_box_mesh_eq",
    "inclusion_mesh",
    "tde_reference",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gates are spawned as SUBPROCESSES and must never be collected by import:
# four filenames collide between suites, the two mollified_kernel copies would
# contend for one module identity, and one gate prepends an oracle directory to
# sys.path and never removes it. norecursedirs is the belt to that braces.
norecursedirs = ["tests/gates"]
markers = ["slow: takes over 60 s (verify_fmm is ~900 s)"]
